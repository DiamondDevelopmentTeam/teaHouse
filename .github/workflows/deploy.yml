name: Deploy 1890 Tea House to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  VITE_BASE_PATH: /teaHouse/

  # Repository variables are preferred. The Azure Function URLs are public
  # configuration values, so these fallbacks are safe to include.
  VITE_INQUIRY_API_URL: ${{ vars.VITE_INQUIRY_API_URL || 'https://diamondpeo-webforms-api-chd0eed4hyhnemft.westus2-01.azurewebsites.net/api/send-inquiry' }}

  VITE_SERVER_APPLICATION_API_URL: ${{ vars.VITE_SERVER_APPLICATION_API_URL || 'https://diamondpeo-webforms-api-chd0eed4hyhnemft.westus2-01.azurewebsites.net/api/send-server-application' }}

  VITE_CONTENT_API_BASE_URL: ${{ vars.VITE_CONTENT_API_BASE_URL }}

  # This must be configured under:
  # Settings -> Secrets and variables -> Actions -> Variables
  VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Diagnose public configuration
        shell: bash
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Base path: $VITE_BASE_PATH"

          if [ -n "$VITE_INQUIRY_API_URL" ]; then
            echo "Inquiry endpoint configured"
          else
            echo "Inquiry endpoint missing"
          fi

          if [ -n "$VITE_SERVER_APPLICATION_API_URL" ]; then
            echo "Server application endpoint configured"
          else
            echo "Server application endpoint missing"
          fi

          if [ -n "$VITE_CONTENT_API_BASE_URL" ]; then
            echo "Content API base URL configured"
          else
            echo "Content API base URL not configured"
          fi

          if [ -n "$VITE_RECAPTCHA_SITE_KEY" ]; then
            echo "reCAPTCHA site key configured"
            echo "reCAPTCHA key length: ${#VITE_RECAPTCHA_SITE_KEY}"
          else
            echo "reCAPTCHA site key missing"
          fi

      - name: Validate public inquiry endpoint
        run: |
          node -e "
          const value = String(process.env.VITE_INQUIRY_API_URL || '').trim();

          if (!value) {
            throw new Error('VITE_INQUIRY_API_URL is required');
          }

          const url = new URL(value);

          if (
            url.protocol !== 'https:' ||
            url.pathname !== '/api/send-inquiry'
          ) {
            throw new Error(
              'VITE_INQUIRY_API_URL must be an HTTPS /api/send-inquiry endpoint'
            );
          }

          console.log('Inquiry endpoint validated:', url.origin + url.pathname);
          "

      - name: Validate public server application endpoint
        run: |
          node -e "
          const value = String(
            process.env.VITE_SERVER_APPLICATION_API_URL || ''
          ).trim();

          if (!value) {
            throw new Error(
              'VITE_SERVER_APPLICATION_API_URL is required'
            );
          }

          const url = new URL(value);

          if (
            url.protocol !== 'https:' ||
            url.pathname !== '/api/send-server-application'
          ) {
            throw new Error(
              'VITE_SERVER_APPLICATION_API_URL must be an HTTPS /api/send-server-application endpoint'
            );
          }

          console.log(
            'Server application endpoint validated:',
            url.origin + url.pathname
          );
          "

      - name: Validate public reCAPTCHA key
        run: |
          node -e "
          const value = String(
            process.env.VITE_RECAPTCHA_SITE_KEY || ''
          ).trim();

          if (!value) {
            throw new Error(
              'VITE_RECAPTCHA_SITE_KEY is required. Configure it under GitHub repository Settings -> Secrets and variables -> Actions -> Variables.'
            );
          }

          if (value.length < 20) {
            throw new Error(
              'VITE_RECAPTCHA_SITE_KEY appears to be invalid or incomplete'
            );
          }

          console.log('reCAPTCHA site key validated');
          "

      - name: Lint source
        run: npm run lint

      - name: Typecheck form service
        run: npm run typecheck

      - name: Test forms
        run: npm run test

      - name: Audit images
        run: npm run audit:images

      - name: Build the site
        run: npm run build

      - name: Verify Pages paths and SPA fallback
        run: npm run verify:pages

      - name: Verify form endpoint and secret isolation
        run: npm run verify:forms

      - name: Verify build output
        shell: bash
        run: |
          if [ ! -d "dist" ]; then
            echo "client/dist was not created"
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "client/dist/index.html was not created"
            exit 1
          fi

          echo "GitHub Pages build output verified"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4